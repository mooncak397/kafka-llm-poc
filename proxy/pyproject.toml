[project]
name = "llm-proxy"
version = "0.2.0"
description = "Thin metrics proxy in front of Ollama (PoC)"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10", "prometheus-client>=0.21"]

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::aiohttp.web_exceptions.NotAppKeyWarning"]
