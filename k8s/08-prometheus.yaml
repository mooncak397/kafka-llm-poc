# S09: plain Prometheus (no operator). emptyDir: data is LOST when the pod restarts (fine for a PoC).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# Read-only pod discovery, only in ns kafka (Role, not ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: kafka
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: monitoring}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # Broker JMX metrics and Kafka Exporter both use the container port named tcp-prometheus.
      - job_name: kafka
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [kafka]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: tcp-prometheus
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # S10: label names the Strimzi dashboards expect
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_cluster]
            target_label: strimzi_io_cluster
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_name]
            target_label: strimzi_io_name
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
      # S13: LLM metrics proxy (static target, no discovery needed)
      - job_name: llm-proxy
        static_configs:
          - targets: [llm-proxy.llm.svc.cluster.local:8080]
      # S19: agent loop
      - job_name: agent
        static_configs:
          - targets: [agent.llm.svc.cluster.local:8080]
      # Later steps add jobs here (GPU exporter S15).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
      annotations:
        # restart the pod when the config changes
        config-hash: "v5"
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
          ports:
            - {name: web, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: web}
          resources:
            requests: {memory: 192Mi, cpu: 50m}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: {app: prometheus}
  ports:
    - {name: web, port: 9090, targetPort: web}
