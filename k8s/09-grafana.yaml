# S10: plain Grafana. emptyDir: state is LOST on pod restart (everything is provisioned, so nothing is lost that matters).
# Not here (made by `make up`): Secret grafana-admin (random password) and ConfigMap grafana-dashboards (from grafana/*.json).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: poc
        type: file
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options: {path: /var/lib/grafana-dashboards}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.6.16
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-password}}
            # anonymous Viewer; reachable only through `make pf-grafana` (127.0.0.1)
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_FEEDBACK_LINKS_ENABLED, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            # Go heap target below the container limit, so the GC works before the OOM killer
            - {name: GOMEMLIMIT, value: 200MiB}
          ports:
            - {name: web, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: web}
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana-dashboards}
      volumes:
        - name: data
          emptyDir: {}
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: {app: grafana}
  ports:
    - {name: web, port: 3000, targetPort: web}
