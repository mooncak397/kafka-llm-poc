<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5794f2"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#73bf69"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff9830"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa0ad"/></marker>
    <style>
      .zone{fill:#13161c;stroke:#2c3039;stroke-width:1.5}
      .ns{fill:#161a21;stroke:#3a4150;stroke-width:1.5;stroke-dasharray:6 5}
      .box{fill:#1c2028;stroke:#3a4150;stroke-width:1.5}
      .t{fill:#e3e6ec;font-size:20px;font-weight:bold}
      .s{fill:#9aa0ad;font-size:16px}
      .z{fill:#9aa0ad;font-size:17px;letter-spacing:.5px}
      .l{fill:#c5c9d2;font-size:15px}
      .ln{fill:none;stroke-width:2.5}
      .bd{fill:#0f1117;stroke:#f2495c;stroke-width:2}
      .bn{fill:#f2495c;font-size:15px;font-weight:bold;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="840" fill="#0f1117"/>
  <text x="24" y="42" fill="#e3e6ec" font-size="26" font-weight="bold">Architecture: Kafka, read-only MCP tools and a local LLM on one laptop</text>

  <!-- zones -->
  <rect class="zone" x="20" y="70" width="270" height="650" rx="10"/>
  <text class="z" x="40" y="102">LAPTOP HOST</text>
  <rect class="zone" x="330" y="70" width="1255" height="650" rx="10"/>
  <text class="z" x="350" y="102">KIND CLUSTER (ROOTLESS PODMAN, ONE NODE)</text>
  <rect class="ns" x="350" y="120" width="470" height="350" rx="8"/>
  <text class="s" x="368" y="148">namespace llm</text>
  <rect class="ns" x="860" y="120" width="390" height="570" rx="8"/>
  <text class="s" x="878" y="148">namespace kafka</text>
  <rect class="ns" x="1285" y="120" width="285" height="350" rx="8"/>
  <text class="s" x="1303" y="148">namespace monitoring</text>

  <!-- host -->
  <rect class="box" x="40" y="175" width="230" height="110" rx="8"/>
  <text class="t" x="58" y="212">Load test</text>
  <text class="s" x="58" y="240">1, 10 or 20 users</text>
  <text class="s" x="58" y="262">closed loop, host script</text>
  <rect class="box" x="40" y="530" width="230" height="150" rx="8"/>
  <text class="t" x="58" y="566">Ollama</text>
  <text class="s" x="58" y="594">own instance, own port</text>
  <text class="s" x="58" y="616">qwen3:4b-instruct-2507</text>
  <text class="s" x="58" y="638">one slot, GTX 1060 6 GB</text>

  <!-- llm ns -->
  <rect class="box" x="380" y="175" width="410" height="110" rx="8"/>
  <text class="t" x="398" y="212">Agent loop</text>
  <text class="s" x="398" y="240">max 5 tool turns, 5 read tools</text>
  <text class="s" x="398" y="262">one question per request</text>
  <rect class="box" x="380" y="330" width="410" height="110" rx="8"/>
  <text class="t" x="398" y="367">LLM metrics proxy</text>
  <text class="s" x="398" y="395">TTFT, tokens/s, queue wait (derived)</text>
  <text class="s" x="398" y="417">one metric label per run</text>

  <!-- kafka ns -->
  <rect class="box" x="885" y="175" width="340" height="110" rx="8"/>
  <text class="t" x="903" y="212">mcp-confluent 1.6.1</text>
  <text class="s" x="903" y="240">allow-list: 5 read tools</text>
  <text class="s" x="903" y="262">user mcp-reader (SCRAM)</text>
  <rect class="box" x="885" y="330" width="340" height="110" rx="8"/>
  <text class="t" x="903" y="367">Kafka 4.3.2, KRaft</text>
  <text class="s" x="903" y="395">Strimzi 1.3.1, one broker</text>
  <text class="s" x="903" y="417">SCRAM login, ACL authorizer</text>
  <rect class="box" x="885" y="560" width="340" height="100" rx="8"/>
  <text class="t" x="903" y="597">Fake data</text>
  <text class="s" x="903" y="625">3 topics, 1 producer,</text>
  <text class="s" x="903" y="647">2 consumer groups</text>

  <!-- monitoring ns -->
  <rect class="box" x="1310" y="175" width="240" height="110" rx="8"/>
  <text class="t" x="1328" y="212">Grafana 11.6</text>
  <text class="s" x="1328" y="240">4 dashboards</text>
  <text class="s" x="1328" y="262">provisioned from JSON</text>
  <rect class="box" x="1310" y="330" width="240" height="110" rx="8"/>
  <text class="t" x="1328" y="367">Prometheus 3.16</text>
  <text class="s" x="1328" y="395">emptyDir storage</text>
  <text class="s" x="1328" y="417">3 scrape jobs</text>

  <!-- lines -->
  <path class="ln" stroke="#9aa0ad" stroke-dasharray="9 6" d="M270 230H380" marker-end="url(#ax)"/>
  <path class="ln" stroke="#5794f2" d="M155 285V385H380" marker-end="url(#ab)"/>
  <path class="ln" stroke="#5794f2" d="M585 285V330" marker-end="url(#ab)"/>
  <path class="ln" stroke="#5794f2" d="M585 440V605H270" marker-end="url(#ab)"/>
  <path class="ln" stroke="#73bf69" d="M790 230H885" marker-end="url(#ag)"/>
  <path class="ln" stroke="#73bf69" d="M1055 285V330" marker-end="url(#ag)"/>
  <path class="ln" stroke="#73bf69" d="M1055 560V440" marker-end="url(#ag)"/>
  <path class="ln" stroke="#ff9830" d="M1225 385H1310" marker-end="url(#aa)"/>
  <path class="ln" stroke="#ff9830" d="M1430 330V285" marker-end="url(#aa)"/>
  <path class="ln" stroke="#ff9830" d="M700 440V500H1430V440" marker-end="url(#aa)"/>
  <text class="l" x="600" y="313">chat requests</text>
  <text class="l" x="1070" y="540">writes and reads</text>

  <!-- layer badges -->
  <circle class="bd" cx="1205" cy="196" r="13"/><text class="bn" x="1205" y="201">1</text>
  <circle class="bd" cx="1055" cy="308" r="13"/><text class="bn" x="1055" y="313">2</text>
  <circle class="bd" cx="1205" cy="351" r="13"/><text class="bn" x="1205" y="356">3</text>

  <!-- bottom strip -->
  <rect class="zone" x="20" y="740" width="1565" height="84" rx="10"/>
  <text class="t" x="40" y="772" font-size="18">Read-only in three layers</text>
  <text class="l" x="380" y="772" font-size="16"><tspan fill="#f2495c" font-weight="bold">1</tspan>  The model sees no write tool</text>
  <text class="l" x="740" y="772" font-size="16"><tspan fill="#f2495c" font-weight="bold">2</tspan>  mcp-reader has Describe and Read ACLs only</text>
  <text class="l" x="1200" y="772" font-size="16"><tspan fill="#f2495c" font-weight="bold">3</tspan>  Kafka authorizer denies by default</text>
  <path class="ln" stroke="#5794f2" d="M40 803H90" marker-end="url(#ab)"/><text class="l" x="102" y="808">LLM requests (raw mode: measured)</text>
  <path class="ln" stroke="#9aa0ad" stroke-dasharray="9 6" d="M470 803H520" marker-end="url(#ax)"/><text class="l" x="532" y="808">agent mode (not measured)</text>
  <path class="ln" stroke="#73bf69" d="M810 803H860" marker-end="url(#ag)"/><text class="l" x="872" y="808">Kafka and MCP traffic</text>
  <path class="ln" stroke="#ff9830" d="M1110 803H1160" marker-end="url(#aa)"/><text class="l" x="1172" y="808">metrics</text>
</svg>
