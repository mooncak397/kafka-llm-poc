[project]
name = "langchain-demo"
version = "0.1.0"
description = "LangChain demo agent over the same read-only mcp-confluent server (not part of the measured path)"
requires-python = ">=3.12"
dependencies = [
    "langchain[mcp]==1.5.2",
    "langchain-anthropic==1.7.11",
    "fastmcp==4.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::langchain_core._api.beta_decorator.LangChainBetaWarning"]
