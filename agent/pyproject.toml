[project]
name = "kafka-agent"
version = "0.1.2"
description = "Tool-calling agent loop: Ollama (via proxy) + mcp-confluent (PoC)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "prometheus-client>=0.21",
    "mcp==1.27.1",
    "anthropic==2.10.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::aiohttp.web_exceptions.NotAppKeyWarning"]
